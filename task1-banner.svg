<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Task 1: Intro to Programming</title>
  <desc id="d">Banner with a catamaran ASV floating on animated waves, listing software architecture, electrical architecture and programming components.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b3a"/>
      <stop offset="1" stop-color="#0f5132"/>
    </linearGradient>
    <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fa87f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b3d3a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0b3d3a" stop-opacity="0.90"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="240" rx="12"/></clipPath>
  </defs>
  <style>
    .title { font: 700 38px "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .sub   { font: 400 17px "Segoe UI", Helvetica, Arial, sans-serif; fill: #a7f3d0; }
    .tags  { font: 400 13px "Segoe UI", Helvetica, Arial, sans-serif; fill: #d1fae5; letter-spacing: 0.4px; }
    .wave1 { animation: drift 9s linear infinite; }
    .wave2 { animation: drift 14s linear infinite reverse; }
    .boat  { animation: bob 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ring  { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-450px); } }
    @keyframes bob   { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-4px) rotate(1deg); } }
    @keyframes ping  { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .wave1, .wave2, .boat, .ring { animation: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="240" fill="url(#bg)"/>

    <text class="title" x="40" y="82">Task 1: Intro to Programming</text>
    <text class="sub"   x="40" y="114">ASV reference: NUS Bumblebee BBASV 1.0 (RobotX 2016)</text>
    <text class="tags"  x="40" y="150">Software Architecture  ·  Electrical Architecture  ·  Programming Components</text>

    <g transform="translate(730 138)">
      <g class="boat">
        <line x1="0" y1="10" x2="0" y2="-14" stroke="#e5e7eb" stroke-width="2"/>
        <circle class="ring" cx="0" cy="-16" r="5" fill="none" stroke="#5eead4" stroke-width="2"/>
        <circle cx="0" cy="-16" r="4" fill="#5eead4"/>
        <rect x="-22" y="10" width="44" height="18" rx="3" fill="#e5e7eb"/>
        <rect x="-14" y="14" width="28" height="7" rx="2" fill="#0b1b3a"/>
        <rect x="-64" y="28" width="128" height="9" rx="3" fill="#cbd5e1"/>
        <path d="M-68 37 h46 l-7 16 h-34 z" fill="#f59e0b"/>
        <path d="M22 37 h46 l-5 16 h-34 z" fill="#f59e0b"/>
      </g>
    </g>

    <g class="wave1">
      <path fill="url(#sea1)" d="M0 186 q56.25 -16 112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 V240 H0 Z"/>
    </g>
    <g class="wave2">
      <path fill="url(#sea2)" d="M0 204 q56.25 -14 112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 V240 H0 Z"/>
    </g>
  </g>
</svg>
